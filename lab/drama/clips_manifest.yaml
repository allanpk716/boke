# clips_manifest.yaml — 实验片段统一清单（schema_version 1）
# 维护方：tools/cut_clips.py（cut 子命令会整体重写本文件；手工改请只改 clips 条目的 layer/note/provisional 字段值）
# 字段说明：
#   clip_id      唯一 ID（前缀=来源标签）
#   source       来源：bili|blender|dnr|constructed
#   source_file  源媒体路径（相对本文件所在目录；gitignored）
#   language     语言：en|zh|...
#   layer        分层标签：对白干净|音乐重|音效压对白|双人重叠|有5.1|待听审标注
#   provisional  true=粗标待复核（配额进度单列，不计入 confirmed）
#   start/end    计划起止点（秒）；duration 实测输出时长（秒）
#   path         44.1kHz 主档 wav；path_16k 16kHz 副档 wav（相对本文件所在目录）
#   status       cut=已切片且时长校验通过；pending=已登记待切片
#   note         备注
# quota_progress 每来源每语言分层计数（confirmed/provisional 与 F6 配额目标），由脚本从 clips 自动重算。
schema_version: 1
notes: Sintel 网格切片源=media/blender/sintel_stereo.wav（协调者下混 48k，切片时重采样 44.1k/16k）；provisional 标签按剧情结构粗标、未逐段听审；Sintel 对白重叠段稀缺，双人重叠配额主要由 B 站剧承担；无免费英文剧，en 真实轨由 Sintel 英文对白充当（替代记录）；真值对白参照=media/blender/sintel_center.wav（FC 中置），M&E（sintel_me.wav）仅作音乐/音效活动与频谱参照（mastering 失配，逐样本相减不可行），详见 tools/media_sources.md；亮剑 ep01 选 10 段+ep02 选 7 段（30s 网格格位、相邻格位合并至 60s），标注依据=astats 每 30s 格 p90/动态范围/低能量占比能量启发式+剧情锚点推断（片名场景非逐段核实），全部 provisional 待听审；solo_candidate=true 条目为票06 伪重叠原料（疑似单人连续对白，待听审确认）；选段表=media/clips/liangjian_ep01_sel.json 与 liangjian_ep02_sel.json，能量扫描=media/clips/liangjian_ep01_energy.txt 与 liangjian_ep02_energy.txt，选片与获取记录=tools/bili_fetch.md
