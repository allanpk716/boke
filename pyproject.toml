[project]
name = "boke"
version = "0.1.0"
description = "波士顿圆脸采访视频中文配音流水线(OCR字幕+声纹分人+归人+克隆TTS)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python>=4.8"]
tts = ["edge-tts>=7.0"]
diar = ["pyannote.audio>=3.3", "torch>=2.1"]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
