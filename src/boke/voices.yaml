# voices.yaml —— 全局音色库 + 每期映射 (骨架,照 01 §5)
# 人工指认环节(E1)后填 episode_map

global:
  # CosyVoice3 克隆引擎参数(synthesize.py 用)
  cosyvoice_repo: D:/boke_media/tools/CosyVoice
  cosyvoice_model: D:/boke_media/models/Fun-CosyVoice3-0.5B-2512
  edge_fallback_voice: zh-CN-YunxiNeural

library:
  # 博主本人:中文参考音(同语言克隆,最优档)
  # ref_text 为空 → synthesize 自动走 cross_lingual 无文本模式(夜班实测可用)
  # 有逐字稿填入 → zero_shot 模式(效果更优,标记由引擎自动加)
  yuanlian_chinese:
    type: clone
    engine: cosyvoice3
    ref_audio: refs/yuanlian_chinese_01.wav
    ref_text_file: refs/ref01_transcript.txt   # 用户已判 zero(带转写稿)模式更好;synthesize 读此文件
    note: "波士顿圆脸本人,斩杀线视频 728.7~753.7s,频谱核验纯人声;转写=whisper small(个别专名有误,用户验收过效果)"

  # 预设音色兜底(克隆不过关/未知说话人)
  preset_male_calm:
    type: preset
    engine: edge
    voice: zh-CN-YunjianNeural
    note: "男声·沉稳(嘉宾默认,待用户试听台指认替换)"
  preset_male_01:
    type: preset
    engine: edge
    voice: zh-CN-YunxiNeural
    note: "男声预设"
  preset_female_01:
    type: preset
    engine: edge
    voice: zh-CN-XiaoxiaoNeural
    note: "女声预设"

# 每期一条:file 为文件名匹配子串(首个命中生效);用户试听台指认后回填
episode_maps:
  - file: BV17UPszhE6o
    map:
      SPK_00: { voice: yuanlian_chinese, who: 波士顿圆脸(主持) }   # 用户确认: SPK_00=圆脸 13.1min
      SPK_01: { voice: preset_male_calm, who: 小外(嘉宾,英文原声) }  # 25.2min,预设男声草稿,待指认
  - file: DEFAULT
    map:
      SPK_00: { voice: yuanlian_chinese, who: 待指认 }
      SPK_01: { voice: preset_male_calm, who: 待指认 }
      SPK_02: { voice: preset_female_01, who: 待指认 }
