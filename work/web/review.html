<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剥壳配音 · 核对台</title><style>
body{font-family:system-ui,'Microsoft YaHei';margin:0;background:#f0f2f5;color:#222}
header{background:#1c2b3a;color:#fff;padding:12px 22px;display:flex;gap:18px;align-items:center}
header h1{margin:0;font-size:19px}
header .live{background:#3f9a68;color:#fff;font-size:12px;padding:2px 10px;border-radius:10px}
header a{color:#9fc3e8;font-size:13px;text-decoration:none;margin-left:auto;margin-left:8px}
main{max-width:1280px;margin:14px auto;padding:0 14px;display:flex;gap:14px;align-items:flex-start}
#eps{width:250px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-height:82vh;overflow:auto}
#eps .ep{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:6px;border:1px solid #e3e6ea}
#eps .ep.on{background:#e8f0fe;border-color:#2b6cb0;font-weight:600}
#eps .ep .epTitle{font-size:13px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#eps .ep small{display:block;color:#888;font-weight:400;font-size:11px;margin-top:3px}
#eps .ep .need{color:#2b6cb0;font-weight:600}
#stage{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
#playerCard{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#playerCard video{width:100%;max-height:420px;background:#000;border-radius:6px}
.ptabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ptab{padding:6px 16px;border-radius:18px;border:1px solid #cfd6dd;cursor:pointer;font-size:14px;background:#fff}
.ptab.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.ptab .skipflag{color:#c0392b;font-size:12px;margin-left:4px}
#verdict{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#verdict.dub{background:#e8f6ee;border:1px solid #7ec6a3}
#verdict.skip{background:#fdf0e7;border:1px solid #e8a13a}
#verdict button{margin-left:auto}
button{background:#2b6cb0;color:#fff;border:0;border-radius:6px;padding:7px 16px;font-size:14px;cursor:pointer}
button.ghost{background:#fff;color:#2b6cb0;border:1px solid #2b6cb0}
button.small{padding:4px 10px;font-size:13px}
button:disabled{background:#aaa;cursor:not-allowed}
#statusCard{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:14px}
#statusCard .pvbtns{display:flex;gap:10px;margin-top:8px}
#statusCard audio{width:100%;margin-top:8px}
#statusCard .stale{background:#fdf0e7;color:#b06a00;border-radius:6px;padding:4px 10px;font-size:12px;display:inline-block;margin-top:6px}
#archCard{display:none;background:#fdf0e7;border:1px solid #e8a13a;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:14px}
#archCard .cand{margin:6px 0}
#speakers{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent}
.card.host{border-color:#e8a13a;background:#fffdf7}
.card .top{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:#dde3ea;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.card.host .avatar{background:#f4d9a8}
.who{flex:1}.who b{font-size:15px}.who small{display:block;color:#777;font-size:12px}
.hostBtnOn{background:#e8a13a;color:#fff}
audio{width:100%;height:32px;margin-top:6px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:13px}
select,input[type=text]{padding:5px 8px;border:1px solid #cfd6dd;border-radius:6px;font-size:13px}
input[type=text]{width:130px}
.vopt{display:none;margin-top:8px;border-top:1px dashed #e3e6ea;padding-top:8px;font-size:13px}
.cand{display:flex;gap:8px;align-items:center;margin:4px 0}
.cand audio{width:150px;height:28px;margin:0}
.tag{border-radius:4px;font-size:11px;padding:1px 7px}
.tag.ja{background:#fde8e8;color:#c0392b}.tag.en{background:#e8ecfd;color:#4356a8}
.tag.zh{background:#e8f6ee;color:#27764a}.tag.warn{background:#fdf0e7;color:#b06a00}
#libCard{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.person{display:flex;gap:14px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f0f0}
.person audio{width:170px;height:30px;margin:4px 0 0}
#footbar{display:flex;gap:12px;align-items:center;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);flex-wrap:wrap}
#status{font-size:13px;color:#27764a}
#status.err{color:#c0392b}
.note{font-size:12px;color:#999}
#modalWrap{display:none;position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;align-items:center;justify-content:center}
#modalWrap.on{display:flex}
#modal{background:#fff;border-radius:12px;padding:18px 20px;width:460px;max-height:82vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal h3{margin:0 0 4px;font-size:17px}
#modal .row{margin:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
#modal .cand audio{width:170px;height:30px}
.empty{color:#999;font-size:13px;padding:12px}
</style></head><body>
<header><h1>剥壳配音 · 核对台</h1><span class="live">真数据 · 提交即出小样</span>
<a href="/library.html">← 片库</a><a href="/">试听台</a></header>
<main>
<div id="eps"></div>
<div id="stage">
  <div id="playerCard">
    <div class="ptabs" id="ptabs"></div>
    <video id="video" controls preload="none"></video>
    <div class="note">边看边核:说话人样本对应原片声音;播放器支持拖动进度条对照(/media 局域网流播)</div>
  </div>
  <div id="verdict" class="dub"></div>
  <div id="statusCard"></div>
  <div id="archCard"></div>
  <div id="speakers"></div>
  <div id="libCard"><b>人物库</b> <span class="note">(主持人/常客:参考音全局复用;主持人须参考音+转写稿齐备且非本期分P来源)</span><div id="persons"><div class="empty">加载中…</div></div></div>
  <div id="footbar">
    <button id="submitBtn">✓ 提交本 P 核对(自动出小样)</button>
    <span id="status"></span>
    <span class="note">小样过关才跑全片(GPU 40分钟,避免白跑);提交后状态可在上方实时卡看到</span>
  </div>
</div>
</main>
<div id="modalWrap"><div id="modal">
 <h3>➕ 存入人物库</h3>
 <div class="note" id="mSrc"></div>
 <div class="row" style="display:block">采用参考音(可试听换选):<div id="mRefs"></div></div>
 <div class="row">存入:
  <label><input type="radio" name="mtarget" value="exist" checked onchange="mtog(1)"> 已有人物</label>
  <select id="mExist"></select>
  <label><input type="radio" name="mtarget" value="new" onchange="mtog(2)"> 新建人物</label>
  <input type="text" id="mNew" placeholder="人物名" style="display:none;width:110px"></div>
 <div class="row">主要语言:
  <select id="mLang"><option value="zh">中文</option><option value="en">英语</option>
  <option value="ja">日语</option><option value="ko">韩语</option></select></div>
 <div class="row">备注:<input type="text" id="mNote" style="width:250px" placeholder="如:日本记者,常客(可选)"></div>
 <div style="display:flex;gap:10px;margin-top:14px">
  <button onclick="confirmLibSave()">保存</button>
  <button class="ghost" onclick="closeLibModal()">取消</button></div>
</div></div>
<script>
const PRESETS = [["zh-CN-YunjianNeural","云健·男沉稳"],["zh-CN-YunxiNeural","云希·男阳光"],
["zh-CN-YunyangNeural","云扬·男播音"],["zh-CN-YunxiaNeural","云夏·男少年"],
["zh-CN-XiaoxiaoNeural","晓晓·女温暖"],["zh-CN-XiaoyiNeural","晓伊·女活泼"],
["zh-CN-liaoning-XiaobeiNeural","小北·女东北"],["zh-TW-HsiaoChenNeural","曉臻·女台湾"],["zh-HK-HiuMaanNeural","曉曼·女粤语"]];

let LIB=null, EP=null, PERSONS=[], curBv=null, curPart=0;
const EDITS={};            // part号 -> {verdict, speakers:[…用户决策]}
let dirty=false;           // 当前 part 用户改过:轮询不重渲染说话人卡(防丢输入)
const SIGS={};             // part号 -> 说话人 id 签名(rediarize 后自动重建)
let ARCH_NOTE=null;        // 最近一次提交的归档回执(拦截提示块数据源,票06)

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function langTag(l){const m={zh:["zh","中文"],en:["en","英语"],ja:["ja","日语"],ko:["ko","韩语"]}[l]||[l?"unk":"",l||""];return l?`<span class="tag ${m[0]}">${esc(m[1])}</span>`:""}
function talkMin(sec){return sec==null?"":`${(sec/60).toFixed(1)}分钟`}
function fmtS(x){return x==null||isNaN(x)?"":Number(x).toFixed(2)}
function langGroup(l){const n={zh:"中文",en:"英语",ja:"日语",ko:"韩语"}[l];return (n||l||"语言未识别")+"组"}
// 声纹建议徽章(票05四态):suggest/uncalibrated/compete/桩不可用;unknown 只显分数不预填
function voiceBadge(sg){
 if(!sg)return"";
 if(!sg.available){const r=sg.reason||"stub-diarization";
  const t=r==="stub-diarization"?"声纹建议不可用(分人为桩数据)":"声纹建议不可用("+esc(r)+")";
  return `<div class="row"><span class="tag warn">${t}</span></div>`;}
 if(sg.person==null||sg.score==null)return"";
 const who=esc(sg.person)+" "+fmtS(sg.score);
 const lm=sg.lang_missing?'<span class="note">(说话人语言未知,跨语言参考分)</span>':"";
 if(sg.verdict==="suggest")return `<div class="row"><span class="tag zh">声纹建议: ${who}</span>${lm}</div>`;
 if(sg.verdict==="uncalibrated")return `<div class="row"><span class="tag warn">声纹分数: ${who}(未校准,仅参考)</span>${lm}</div>`;
 if(sg.verdict==="compete"){const c=sg.compete_with;
  return `<div class="row"><span class="tag warn">与 ${esc(c?c.spk:"?")} 竞争${esc(sg.person)}(${fmtS(sg.score)} vs ${fmtS(c&&c.score)}),未建议</span></div>`;}
 return `<div class="row"><span class="tag warn">声纹分数: ${who}(未达建议门)</span>${lm}</div>`;}
function url2path(u){if(!u)return null;
 if(u.startsWith("/audio/"))return "work/web/audio/"+u.slice(7);
 if(u.startsWith("/refs/"))return "refs/"+u.slice(6);
 if(u.startsWith("/work/"))return "work/"+u.slice(6);return u}
function setStatus(t,err){const el=document.getElementById("status");el.textContent=t||"";el.className=err?"err":""}

// ---------- 数据加载 ----------
async function loadLib(){try{const r=await fetch('/api/library');LIB=await r.json();}catch(e){}}
async function loadPersons(){try{const r=await fetch('/api/persons');const d=await r.json();if(d.ok)PERSONS=d.persons;}catch(e){}}
async function loadEpisode(bv){try{const r=await fetch(`/api/episode/${bv}`);
 if(!r.ok){EP=null;renderAll();return;}
 EP=await r.json();renderAll();}catch(e){}}

async function boot(){
 await Promise.all([loadLib(),loadPersons()]);
 const q=new URLSearchParams(location.search).get("bv");
 const groups=episodeGroups();
 if(q&&groups.some(g=>g.bvid===q))curBv=q;
 else{const need=groups.find(g=>g.parts.some(p=>p.status==="待核对"));
  curBv=need?need.bvid:(groups[0]?groups[0].bvid:null);}
 renderPersons();
 if(curBv)await loadEpisode(curBv);else renderAll();
}
// 轮询:2s 刷新期列表徽标 + 当前期的状态卡;说话人卡仅在未编辑且分析结论变化时重建
setInterval(async()=>{
 await loadLib();renderEps();
 if(!EP)return;
 try{const r=await fetch(`/api/episode/${curBv}`);if(!r.ok)return;EP=await r.json();}catch(e){return}
 renderPart();renderStatus();
 const p=EP.parts[curPart];
 if(p&&!dirty){
  const sig=JSON.stringify((p.speakers||[]).map(s=>s.id));
  if(SIGS[p.part]!==sig){SIGS[p.part]=sig;delete EDITS[p.part];renderSpeakers();}
 }
},2000);

function episodeGroups(){
 const by={};(LIB&&LIB.records||[]).forEach(r=>{(by[r.bvid]=by[r.bvid]||{bvid:r.bvid,title:r.title||r.bvid,date:r.date,parts:[]}).parts.push(r);});
 return Object.values(by).map(g=>{g.parts.sort((a,b)=>a.part-b.part);return g;});
}

// ---------- 渲染:期列表 ----------
function renderEps(){const box=document.getElementById("eps");box.innerHTML="";
 const groups=episodeGroups();
 if(!groups.length){box.innerHTML='<div class="empty">片库为空:先去片库导入 BV 或勾选清单</div>';return;}
 groups.forEach(g=>{const need=g.parts.filter(p=>p.status==="待核对").length;
  const d=document.createElement("div");d.className="ep"+(g.bvid===curBv?" on":"");
  d.innerHTML=`<div class="epTitle">${esc(g.title)}</div>
   <small>${esc(g.date||"")} · ${esc(g.bvid)} · ${g.parts.map(p=>p.status.replace("待","")).join("/")}</small>
   ${need?`<small class="need">👉 ${need} 个分P待核对</small>`:""}`;
  d.onclick=async()=>{curBv=g.bvid;curPart=0;dirty=false;ARCH_NOTE=null;renderArchNote(null);await loadEpisode(g.bvid);};
  box.appendChild(d);});
}

// ---------- 渲染:分P页签 / 播放器 / 判定条 ----------
function part(){return EP&&EP.parts[curPart]||null}
function edits(p){
 if(!EDITS[p.part])EDITS[p.part]={
  verdict:p.suggest==="skip"?"skip":"dub",
  speakers:(p.speakers||[]).map(s=>{
   const sg=(s.suggest&&s.suggest.available)?s.suggest:null;
   const pre=(sg&&sg.verdict==="suggest"&&sg.person)||null; // 声纹预填:仅 suggest(uncalibrated/compete/unknown 不预填)
   const host=!!(pre&&sg.host_candidate&&sg.calibrated);     // 主持人须 host_candidate+calibrated 双真
   return {id:s.id,lang:s.lang,talk_sec:s.talk_sec,
    sample:s.sample,cands:s.cands||[],note:"",host,
    host_person:pre,merge:"",voice:"clone",
    preset_voice:"zh-CN-YunjianNeural",cand_idx:0}})};
 return EDITS[p.part];
}
function renderPart(){const p=part();const tabs=document.getElementById("ptabs");tabs.innerHTML="";
 if(!EP){document.getElementById("video").src="";document.getElementById("verdict").innerHTML="";return;}
 EP.parts.forEach((pt,i)=>{const t=document.createElement("div");t.className="ptab"+(i===curPart?" on":"");
  t.innerHTML=`P${pt.part}`+(pt.suggest==="skip"?'<span class="skipflag">建议跳过</span>':"");
  t.onclick=()=>{curPart=i;dirty=false;ARCH_NOTE=null;renderArchNote(null);renderPart();renderSpeakers();renderStatus();};
  tabs.appendChild(t);});
 const v=document.getElementById("video");
 const want=p&&p.media_url?p.media_url:"";
 if(v.getAttribute("src")!==want)v.src=want;   // 同值不重设,防轮询重置播放进度
 if(!p){document.getElementById("verdict").innerHTML="";return;}
 const e=edits(p);const note=(p.langid&&p.langid.verdict)||"无语言检测结论";
 const vd=document.getElementById("verdict");vd.className=e.verdict==="skip"?"skip":"dub";
 vd.innerHTML=`<b>P${p.part}</b> 语言检测:${esc(note)} → 当前判定:<b>${e.verdict==="skip"?"跳过(不出片)":"配音"}</b>
  <button class="small ghost" onclick="flipVerdict()">${e.verdict==="skip"?"改为配音":"改为跳过"}</button>
  <button class="small ghost" onclick="rediarize()">↻ 重跑分人(清空决策)</button>`;
}
function flipVerdict(){const p=part();const e=edits(p);e.verdict=e.verdict==="skip"?"dub":"skip";dirty=true;renderPart();}

// ---------- 渲染:状态卡(小样区) ----------
let _statusSig=null;
function renderStatus(){const box=document.getElementById("statusCard");const p=part();
 if(!p){box.innerHTML="";_statusSig=null;return;}
 // 签名没变就不重建 DOM:轮询不得打断小样/成品试听播放(含 part 号,切页签必刷新)
 const sig=JSON.stringify([p.part,p.status,p.busy,p.preview_url,p.preview_stale,p.output_url,p.error,p.failed_stage]);
 if(sig===_statusSig)return;
 _statusSig=sig;
 const e=edits(p);let h=`<b>P${p.part} · ${esc(p.status)}</b>${p.busy?' <span class="tag warn">后台进行中…</span>':""}`;
 if(p.status==="待核对"){
  h+=`<div class="note">确认说话人/主持人/音色后点下方「提交」——系统自动生成小样(片头60s+对话密集60s,用最终音色)</div>`;
 }else if(p.status==="已核对待合成"){
  h+=p.busy?`<div class="note">小样生成中(约2-3分钟),完成后此处出现播放器</div>`
   :`<div class="note">等待小样任务…(若长时间不动,可能是失败前的瞬态,稍候自动恢复)</div>`;
 }else if(p.status==="小样待听"){
  h+=`<div class="note">听小样,拦住"只有耳朵能发现的问题";不过可回核对台改决策重出</div>`;
  if(p.preview_url){h+=`<audio controls preload="none" src="${esc(p.preview_url)}"></audio>`;}
  else h+=`<div class="note">小样文件路径缺失:${esc(p.preview_url)}</div>`;
  if(p.preview_stale)h+=`<span class="stale">⚠ 该小样已作废(决策改过),仅供回听;提交新决策后自动重出</span>`;
  h+=`<div class="pvbtns"><button onclick="pv('pass')">✓ 过 → 自动全片合成(约40分钟)</button>
   <button class="ghost" onclick="pv('fail')">✗ 不过 → 回核对台改决策</button></div>`;
 }else if(p.status==="全片合成中"){
  h+=`<div class="note">全片合成中(GPU 约40分钟),完成后成品挂试听台</div>`;
 }else if(p.status==="已交付"){
  h+=`<div class="note">已交付 🎉</div>`;
  if(p.output_url)h+=`<audio controls preload="none" src="${esc(p.output_url)}"></audio>`;
 }else if(p.status==="已排除"){
  h+=`<div class="note">已按你的确认跳过(全中文,不出片)</div>`;
 }else if(p.status==="失败"){
  h+=`<div style="color:#c0392b;font-size:13px;margin-top:6px">失败于 ${esc(p.failed_stage||"?")} : ${esc(p.error||"")}</div>
   <div class="pvbtns"><button onclick="retryP()">重试(断点续跑)</button></div>`;
 }
 box.innerHTML=h;
 const btn=document.getElementById("submitBtn");
 btn.disabled=p.status!=="待核对";
}
async function pv(v){const p=part();
 try{const r=await fetch(`/api/preview/${EP.bvid}/${p.part}`,{method:"POST",
  headers:{'Content-Type':'application/json'},body:JSON.stringify({verdict:v})});
  const d=await r.json();
  if(!r.ok||!d.ok){setStatus("❌ "+(d&&d.error||r.status),true);return;}
  setStatus(v==="pass"?"已点过,全片合成启动…":"已退回待核对,改完决策重新提交即可");
  dirty=false;await loadEpisode(EP.bvid);
 }catch(e){setStatus("❌ 网络错误",true);}}
async function retryP(){const p=part();
 try{const r=await fetch(`/api/retry/${EP.bvid}/${p.part}`,{method:"POST"});
  const d=await r.json();
  if(!r.ok||!d.ok){setStatus("❌ "+(d&&d.error||r.status),true);return;}
  setStatus("重试已提交…");await loadEpisode(EP.bvid);
 }catch(e){setStatus("❌ 网络错误",true);}}

// ---------- 归档拦截提示块(票06 D6:默认拦下,试听后可「仍入库」人工裁决) ----------
function renderArchNote(a){
 const box=document.getElementById("archCard");
 if(!a||!(a.blocked||[]).length){box.style.display="none";box.innerHTML="";return;}
 box.style.display="";
 box.innerHTML=`<b>⚠ ${a.blocked.length} 条新样本与人物现有声纹档案明显不符,默认未入库</b>
  <div class="note">新样本均分低于同人分布 p5(认错人/坏样本的常见信号);可试听核对,确认无误再「仍入库」</div>`+
  a.blocked.map(b=>`<div class="cand">
   ${b.sample_url?`<audio controls preload="none" src="${esc(b.sample_url)}"></audio>`:`<span class="note">(样本不在服务目录:${esc(b.sample_path||"")})</span>`}
   <span class="note"><b>${esc(b.spk)}</b> → ${esc(b.person||"?")} ${langTag(b.lang)} 均分 ${fmtS(b.score)} &lt; p5 ${fmtS(b.p5)}</span>
   <button class="small" onclick="forceArchive('${esc(b.spk)}')">仍入库</button></div>`).join("")+
  `<div class="row"><button class="small ghost" onclick="ARCH_NOTE=null;renderArchNote(null)">忽略,保持不入库</button></div>`;
}
async function forceArchive(spk){
 try{const r=await fetch("/api/review/archive_force",{method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({bvid:EP.bvid,part:part().part,spk})});
  const d=await r.json();
  if(!r.ok||!d.ok){setStatus("❌ 仍入库失败:"+(d&&d.error||r.status),true);return;}
  setStatus(`✅ 已仍入库:${spk} → ${d.person}(${langGroup(d.lang)}现有 ${d.total_after} 条)`);
  if(ARCH_NOTE){ARCH_NOTE.blocked=(ARCH_NOTE.blocked||[]).filter(b=>b.spk!==spk);
   renderArchNote(ARCH_NOTE);}
 }catch(e){setStatus("❌ 网络错误",true);}}
async function rediarize(){const p=part();
 const n=parseInt(prompt("重跑分人:最多几个人?(既有决策将清空重来)","4"),10);
 if(!n||n<1)return;
 const dec={verdict:"dub",speakers:[],rediarize:{max_speakers:n}};
 try{const r=await fetch("/api/review",{method:"POST",headers:{'Content-Type':'application/json'},
  body:JSON.stringify({bvid:EP.bvid,part:p.part,decision:dec})});
  const d=await r.json();
  if(!r.ok||!d.ok){setStatus("❌ "+(d&&d.error||r.status),true);return;}
  setStatus(`已提交重跑分人(≤${n}人),决策已清空;完成后说话人卡自动刷新`);
  delete EDITS[p.part];dirty=false;await loadEpisode(EP.bvid);
 }catch(e){setStatus("❌ 网络错误",true);}}

// ---------- 渲染:说话人卡 ----------
function renderSpeakers(){const p=part();const box=document.getElementById("speakers");
 if(!p){box.innerHTML="";return;}
 if(p.busy&&p.status==="待核对"){box.innerHTML='<div class="empty">分人重算中…(重跑分人完成后自动刷新)</div>';return;}
 const e=edits(p);
 if(!(p.speakers||[]).length){box.innerHTML='<div class="empty">该分P还没有说话人分析结论(等分析完成,或状态未到待核对)</div>';return;}
 box.innerHTML="";
 e.speakers.forEach((s,si)=>{
  const api=(p.speakers||[]).find(x=>x.id===s.id);
  const vb=voiceBadge(api&&api.suggest);   // 声纹徽章:显示层每次照 API 最新建议渲染
  const others=e.speakers.filter(o=>o.id!==s.id).map(o=>`<option value="${esc(o.id)}" ${s.merge===o.id?"selected":""}>${esc(o.id)}</option>`).join("");
  const presets=PRESETS.map(([v,n])=>`<option value="${v}" ${s.preset_voice===v?"selected":""}>${n}</option>`).join("");
  const cl=(s.cands.length?s.cands:(s.sample?[s.sample]:[]));
  const candHtml=cl.map((c,i)=>`<div class="cand"><input type="radio" name="cand${si}" ${s.cand_idx===i?"checked":""}
    onchange="setCand(${si},${i})">${i+1?"①②"[i]||i+1:""}
    <audio controls preload="none" src="${esc(c)}"></audio>
    <span class="note">${i===0?"候选①(自动预选)":"候选②"}</span></div>`).join("")
   +`<div class="note">候选=该说话人不同时段原声;参考音干净度决定克隆相似度。选中项将作为 clone_ref</div>`;
  const persons=PERSONS.map(x=>`<option value="${esc(x.name)}" ${s.host_person===x.name?"selected":""}>${esc(x.name)}</option>`).join("");
  const c=document.createElement("div");c.className="card"+(s.host?" host":"");
  c.innerHTML=`
   <div class="top">
    <div class="avatar" title="头像后期由用户手动上传管理">👤</div>
    <div class="who"><b>${esc(s.id)}</b> ${langTag(s.lang)} <span class="note">${talkMin(s.talk_sec)}</span></div>
    <button class="small ${s.host?"hostBtnOn":"ghost"}" onclick="toggleHost(${si})">${s.host?"✓ 主持人":"设为主持人"}</button>
   </div>
   ${vb}
   ${s.sample?`<audio controls preload="none" src="${esc(s.sample)}"></audio>`:`<div class="note">该说话人暂无切好的样本(speaker_sample.wav),可先看视频听声</div>`}
   ${s.merge?"":`<div class="row"><button class="small ghost" onclick="openLibModal(${si})">➕ 存入人物库…</button>
    <span class="note">(参考音 → 人物,全局复用/声纹底料)</span></div>`}
   <div class="row">备注名 <input type="text" value="${esc(s.note)}" placeholder="纯备注,方便认人" oninput="EDITS[${p.part}].speakers[${si}].note=this.value;dirty=true">
    合并到 <select onchange="EDITS[${p.part}].speakers[${si}].merge=this.value;dirty=true;renderSpeakers()"><option value="">不合并</option>${others}</select></div>
   ${s.merge?`<div class="note" style="margin-top:6px">↩ 已标记合并到 ${esc(s.merge)}(提交后归人重算)</div>`
    :s.host?`<div class="vopt" style="display:block">
     主持人声音来自<b>人物库</b>(不用本期原声,zero 克隆):
     <select onchange="EDITS[${p.part}].speakers[${si}].host_person=this.value;dirty=true">${persons}</select>
     <div class="note">所选人物须有"参考音+转写稿"齐备且非本期分P来源,否则提交会被拦并明示缺项</div></div>`
   :`
   <div class="row">声音:
    <label><input type="radio" name="v${si}" ${s.voice==="clone"?"checked":""} onchange="setVoice(${si},'clone')"> 克隆(本人原声)</label>
    <label><input type="radio" name="v${si}" ${s.voice==="preset"?"checked":""} onchange="setVoice(${si},'preset')"> 预设音色</label>
    <label><input type="radio" name="v${si}" ${s.voice==="skip"?"checked":""} onchange="setVoice(${si},'skip')"> 跳过(不配,保留原声)</label>
   </div>
   <div class="vopt" style="display:${s.voice==="clone"?"block":"none"}" id="cand${si}">${candHtml}</div>
   <div class="vopt" style="display:${s.voice==="preset"?"block":"none"}" id="pre${si}">
    <select onchange="EDITS[${p.part}].speakers[${si}].preset_voice=this.value;dirty=true">${presets}</select>
    <div class="note">edge-tts 预设音色;主持人类声音建议走人物库克隆</div></div>`}`;
  box.appendChild(c);});
}
function setCand(si,i){const p=part();edits(p).speakers[si].cand_idx=i;dirty=true;
 document.querySelectorAll(`input[name=cand${si}]`).forEach(r=>r.checked=false);
 const el=document.querySelector(`input[name=cand${si}][onchange*="setCand(${si},${i})"]`);
 if(el)el.checked=true;}
function setVoice(si,v){const p=part();edits(p).speakers[si].voice=v;dirty=true;
 const c=document.getElementById("cand"+si),pr=document.getElementById("pre"+si);
 if(c)c.style.display=v==="clone"?"block":"none";
 if(pr)pr.style.display=v==="preset"?"block":"none";}
function toggleHost(si){const p=part();const e=edits(p);const s=e.speakers[si];
 if(!s.host){e.speakers.forEach(o=>o.host=false);s.host=true;
  s.host_person=s.host_person||(PERSONS[0]&&PERSONS[0].name)||"圆脸";} // 已有声纹预填/用户改过则不覆盖
 else s.host=false;
 dirty=true;renderSpeakers();}

// ---------- 渲染:人物库 ----------
const TINTS=[["#eef4fb","#4a7ec0"],["#f4f0fa","#8a6fc0"],["#eefaf1","#3f9a68"],
             ["#fdf3ea","#c08a4a"],["#faf0f3","#c05a7a"],["#f0f5f2","#5a8a80"]];
function renderPersons(){const box=document.getElementById("persons");
 if(!PERSONS.length){box.innerHTML='<div class="empty">人物库为空</div>';return;}
 box.innerHTML=PERSONS.map((p,i)=>{const [bg,edge]=TINTS[i%TINTS.length];
  // F9:人物卡展示默认只列克隆用途参考音;自动归档声纹样本(use=voiceid)不混入选音/试听列表
  const all=p.refs||[];
  const cloneRefs=all.filter(r=>(r.use||"clone")==="clone");
  const vidN=all.length-cloneRefs.length;
  const refs=cloneRefs.map(r=>`<div class="cand">
    ${r.audio_url?`<audio controls preload="none" src="${esc(r.audio_url)}"></audio>`:`<span class="note">(参考音文件不在服务目录:${esc(r.audio)})</span>`}
    <span class="note">${esc(r.lang||"")}${r.transcript?" · 有转写稿(可当主持人)":" · 无转写稿(只可 cross 克隆)"}${r.source&&r.source.kind==="episode"?` · 收录自 ${esc(r.source.bvid)} P${r.source.part} ${esc(r.source.spk)}`:" · 手动收录"}</span></div>`).join("");
  const extra=vidN?`<div class="note">另有 ${vidN} 条自动归档声纹样本(use=voiceid,只用于声纹建议,不参与克隆选音/主持人挂接)</div>`:"";
  const open=!!ARCH_OPEN[p.name];   // 票07:声纹档案管理区(展开按需拉取)
  return `<div class="person" style="background:${bg};border-left:4px solid ${edge};border-radius:8px;padding:8px 10px;margin:6px 0">
   <div class="avatar" style="background:${edge}33;border:2px solid ${edge}">👤</div>
   <div style="flex:1"><b style="color:${edge}">${esc(p.name)}</b> ${langTag(p.main_lang)} <span class="note">${esc(p.note||"")}</span>${refs}${extra}
    <div class="row"><button class="small ghost" onclick="toggleArchive(${i})">${open?"▾":"▸"} 声纹档案(${vidN})</button>
     <span class="note">(自动归档样本管理:试听/删除;失效条不参与识别与计数)</span></div>
    ${open?renderArchive(i):""}</div></div>`;}).join("");
}

// ---------- 声纹档案管理区(票07:人物×语言分组列表/试听/删除;F11 失效标记) ----------
const ARCH={}, ARCH_OPEN={};   // 人物名 → /archive 响应缓存;展开状态
function toggleArchive(i){const p=PERSONS[i];if(!p)return;
 if(ARCH_OPEN[p.name]){ARCH_OPEN[p.name]=false;renderPersons();return;}
 ARCH_OPEN[p.name]=true;renderPersons();
 if(!ARCH[p.name])loadArchive(i);}
async function loadArchive(i){const p=PERSONS[i];if(!p)return;
 try{const r=await fetch("/api/persons/"+encodeURIComponent(p.name)+"/archive");
  const d=await r.json();
  if(d.ok){ARCH[p.name]=d;if(ARCH_OPEN[p.name])renderPersons();}}catch(e){}}
function renderArchive(i){const p=PERSONS[i];const d=ARCH[p.name];
 if(!d)return '<div class="note">档案加载中…</div>';
 if(!(d.groups||[]).length)return '<div class="note">暂无声纹档案(提交核对并分配人物后自动归档到这里)</div>';
 return d.groups.map((g,gi)=>`<div style="margin:6px 0 2px">
  <b>${esc(langGroup(g.lang))} ${g.count} 条</b>${g.invalid?` <span class="tag warn">另有 ${g.invalid} 条失效</span>`:""}
  ${g.entries.map((e,ei)=>`<div class="cand" ${e.valid?"":'style="opacity:.45"'}>
   ${e.valid?(e.audio_url?`<audio controls preload="none" src="${esc(e.audio_url)}"></audio>`:`<span class="note">(样本不在服务目录:${esc(e.ref_path)})</span>`):`<span class="tag warn">文件缺失(失效)</span>`}
   <span class="note">${e.bvid?`${esc(e.bvid)} P${esc(e.part)} ${esc(e.spk||"")}`:"来源未知"}${e.model?` · ${esc(e.model)}`:""}${e.ts?` · ${esc(e.ts)}`:""}</span>
   <button class="small ghost" onclick="delArchive(${i},${gi},${ei})">删除</button></div>`).join("")}
  </div>`).join("");}
async function delArchive(i,gi,ei){const p=PERSONS[i];if(!p)return;
 const g=((ARCH[p.name]||{}).groups||[])[gi];const e=g&&g.entries[ei];
 if(!e)return;
 if(!confirm("删除该归档条目?将级联清理参考音条目、声纹向量与样本文件,不可恢复"))return;
 try{const r=await fetch("/api/persons/"+encodeURIComponent(p.name)+"/archive",
  {method:'DELETE',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({ref_path:e.ref_path})});
  const d=await r.json();
  if(!r.ok||!d.ok){setStatus("❌ 删除失败:"+(d&&d.error||r.status),true);return;}
  setStatus(`✅ 已删除「${p.name}」的归档条目(向量记录 ${d.cache_removed} 条、样本文件 ${d.sample_files_deleted.length} 个)`);
  loadArchive(i);}catch(e){setStatus("❌ 网络错误",true);}}

// ---------- 存入人物库弹窗 ----------
let libCtx=null;
function openLibModal(si){const p=part();const e=edits(p);const s=e.speakers[si];
 libCtx={p,s};
 const cl=(s.cands.length?s.cands:(s.sample?[s.sample]:[]));
 if(!cl.length){alert("该说话人没有可用的参考音(样本/候选都缺)");return;}
 document.getElementById("mSrc").textContent=`来源:${EP.title} P${p.part} · ${s.id}(${s.lang||"?"}) · ${talkMin(s.talk_sec)}(episode 溯源自动带 bvid/part/spk)`;
 document.getElementById("mRefs").innerHTML=cl.map((c,i)=>`<div class="cand">
  <input type="radio" name="mref" value="${i}" ${i===0?"checked":""}>
  <audio controls preload="none" src="${esc(c)}"></audio><span class="note">${i===0?"候选①":"候选②"}</span></div>`).join("");
 document.getElementById("mExist").innerHTML=PERSONS.map(x=>`<option>${esc(x.name)}</option>`).join("");
 const sg=(s.suggest&&s.suggest.available&&s.suggest.verdict==="suggest")?s.suggest:null;
 if(sg&&sg.person){const sel=document.getElementById("mExist");   // 声纹建议可信 → 存入目标预选(可改)
  if([...sel.options].some(o=>o.value===sg.person))sel.value=sg.person;}
 document.getElementById("mLang").value=s.lang||"zh";
 document.getElementById("mNote").value="";document.getElementById("mNew").value="";
 mtog(1);document.getElementById("modalWrap").classList.add("on");}
function mtog(k){document.getElementById("mExist").style.display=k===1?"":"none";
 document.getElementById("mNew").style.display=k===2?"":"none";}
function closeLibModal(){document.getElementById("modalWrap").classList.remove("on");libCtx=null;}
async function confirmLibSave(){if(!libCtx)return;const {p,s}=libCtx;
 const mode=document.querySelector('input[name=mtarget]:checked').value;
 const lang=document.getElementById("mLang").value;
 const note=document.getElementById("mNote").value.trim();
 const cl=(s.cands.length?s.cands:(s.sample?[s.sample]:[]));
 const pick=cl[parseInt((document.querySelector('input[name=mref]:checked')||{value:"0"}).value,10)]||cl[0];
 const body={audio:pick,lang,note,
  source:{kind:"episode",bvid:EP.bvid,part:p.part,spk:s.id}};
 if(mode==="new"){const name=document.getElementById("mNew").value.trim();
  if(!name){alert("请填人物名");return;}
  body.new_name=name;body.main_lang=lang;}
 else body.person=document.getElementById("mExist").value;
 try{const r=await fetch("/api/persons/ref",{method:"POST",headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok||!d.ok){alert("存入失败:"+(d&&d.error||r.status));return;}
  setStatus(`✅ 已存入人物「${mode==="new"?body.new_name:body.person}」(来源 ${EP.bvid} P${p.part} ${s.id})`);
  closeLibModal();await loadPersons();renderPersons();
 }catch(e){setStatus("❌ 网络错误",true);}}

// ---------- 提交核对 ----------
document.getElementById("submitBtn").onclick=async()=>{
 const p=part();if(!p)return;const e=edits(p);
 const dec={verdict:e.verdict,
  speakers:e.speakers.map(s=>({
   id:s.id,note:s.note||"",host:!!s.host,
   host_person:s.host?(s.host_person||PERSONS[0]&&PERSONS[0].name):null,
   person:s.host?null:(s.host_person||null), // 声纹归档目标(建议预填/人工指认,提交=确认;票06)
   merge_into:s.merge||null,
   voice:s.host?"clone":s.voice,
   preset_voice:s.voice==="preset"?s.preset_voice:null,
   clone_ref:(!s.host&&s.voice==="clone")?url2path((s.cands.length?s.cands:s.sample?[s.sample]:[])[s.cand_idx]||null):null}))};
 try{const r=await fetch("/api/review",{method:"POST",headers:{'Content-Type':'application/json'},
  body:JSON.stringify({bvid:EP.bvid,part:p.part,decision:dec})});
  const d=await r.json();
  if(r.status===400){setStatus("❌ "+d.error,true);return;}
  if(!r.ok||!d.ok){setStatus("❌ "+(d&&d.error||r.status),true);return;}
  if(d.voided){setStatus("已提交重跑分人,决策已清空");delete EDITS[p.part];}
  else if(d.excluded)setStatus(`✅ P${p.part} 已按你的确认排除(全中文跳过)`);
  else{let m=`✅ 已提交(决策 ${d.dec_hash}),小样生成中…`; // 归档回显(D4:已为圆脸归档 2 条(中文组现有 8 条))
   const sums=(d.archive&&d.archive.summaries)||[];
   if(sums.length)m+=" | "+sums.map(s=>`已为${s.person}归档 ${s.archived} 条(${langGroup(s.lang)}现有 ${s.total} 条)`).join(";");
   if(d.archive&&d.archive.archive_error)m+=` | ⚠ 声纹归档未完成:${d.archive.archive_error}`;
   setStatus(m);}
  ARCH_NOTE=d.archive||null; // 拦截提示块(D6:试听+仍入库),切走自动收起
  renderArchNote(ARCH_NOTE);
  dirty=false;await loadEpisode(EP.bvid);
 }catch(e){setStatus("❌ 网络错误",true);}};

function renderAll(){renderEps();renderPart();renderStatus();renderSpeakers();}
boot();
</script></body></html>
