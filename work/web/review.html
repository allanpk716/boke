<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剥壳配音 · 核对台(mock)</title><style>
body{font-family:system-ui,'Microsoft YaHei';margin:0;background:#f0f2f5;color:#222}
header{background:#1c2b3a;color:#fff;padding:12px 22px;display:flex;gap:18px;align-items:center}
header h1{margin:0;font-size:19px}
header .mock{background:#e8a13a;color:#333;font-size:12px;padding:2px 10px;border-radius:10px}
header a{color:#9fc3e8;font-size:13px;margin-left:auto;text-decoration:none}
main{max-width:1280px;margin:14px auto;padding:0 14px;display:flex;gap:14px;align-items:flex-start}
#eps{width:250px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#eps .ep{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:6px;border:1px solid #e3e6ea}
#eps .ep.on{background:#e8f0fe;border-color:#2b6cb0;font-weight:600}
#eps .ep .epTitle{font-size:13px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#eps .ep small{display:block;color:#888;font-weight:400;font-size:11px;margin-top:3px}
#stage{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
#playerCard{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#playerCard video{width:100%;max-height:420px;background:#000;border-radius:6px}
.ptabs{display:flex;gap:8px;margin-bottom:8px}
.ptab{padding:6px 16px;border-radius:18px;border:1px solid #cfd6dd;cursor:pointer;font-size:14px;background:#fff}
.ptab.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.ptab .skipflag{color:#c0392b;font-size:12px;margin-left:4px}
#verdict{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;align-items:center;gap:12px}
#verdict.dub{background:#e8f6ee;border:1px solid #7ec6a3}
#verdict.skip{background:#fdf0e7;border:1px solid #e8a13a}
#verdict button{margin-left:auto}
button{background:#2b6cb0;color:#fff;border:0;border-radius:6px;padding:7px 16px;font-size:14px;cursor:pointer}
button.ghost{background:#fff;color:#2b6cb0;border:1px solid #2b6cb0}
button.small{padding:4px 10px;font-size:13px}
#speakers{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent}
.card.host{border-color:#e8a13a;background:#fffdf7}
.card .top{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:#dde3ea;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative}
.card.host .avatar{background:#f4d9a8}
.who{flex:1}.who b{font-size:15px}.who small{display:block;color:#777;font-size:12px}
.star{display:none}
.hostBtnOn{background:#e8a13a;color:#fff}
audio{width:100%;height:32px;margin-top:6px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:13px}
select,input[type=text]{padding:5px 8px;border:1px solid #cfd6dd;border-radius:6px;font-size:13px}
input[type=text]{width:130px}
.vopt{display:none;margin-top:8px;border-top:1px dashed #e3e6ea;padding-top:8px;font-size:13px}
.cand{display:flex;gap:8px;align-items:center;margin:4px 0}
.cand audio{width:150px;height:28px;margin:0}
.tag{border-radius:4px;font-size:11px;padding:1px 7px}
.tag.ja{background:#fde8e8;color:#c0392b}.tag.en{background:#e8ecfd;color:#4356a8}
.tag.zh{background:#e8f6ee;color:#27764a}.tag.warn{background:#fdf0e7;color:#b06a00}
#libCard{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.person{display:flex;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0}
.person audio{width:170px;height:30px;margin:4px 0 0}
#footbar{display:flex;gap:12px;align-items:center;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#status{font-size:13px;color:#27764a}
.note{font-size:12px;color:#999}
#modalWrap{display:none;position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;align-items:center;justify-content:center}
#modalWrap.on{display:flex}
#modal{background:#fff;border-radius:12px;padding:18px 20px;width:460px;max-height:82vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal h3{margin:0 0 4px;font-size:17px}
#modal .row{margin:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
#modal .cand{display:flex;gap:8px;align-items:center;margin:4px 0}
#modal .cand audio{width:170px;height:30px}
</style></head><body>
<header><h1>剥壳配音 · 核对台</h1><span class="mock">MOCK · 点击交互可用,提交落 JSON,合成动作为占位</span>
<a href="/library.html">← 片库</a><a href="/">试听台</a></header>
<main>
<div id="eps"></div>
<div id="stage">
  <div id="playerCard">
    <div class="ptabs" id="ptabs"></div>
    <video id="video" controls preload="none"></video>
    <div class="note">边看边核:说话人样本对应原片声音;播放器支持拖动进度条对照</div>
  </div>
  <div id="verdict"></div>
  <div id="speakers"></div>
  <div id="libCard"><b>人物库</b> <span class="note">(主持人/常客:头像+参考音,头像手动上传管理)</span><div id="persons"></div></div>
  <div id="footbar">
    <button id="previewBtn">▶ 出小样(片头60s+中段60s)</button>
    <button id="submitBtn">✓ 提交本 P 核对</button>
    <span id="status"></span>
    <span class="note">小样过关才跑全片(GPU 40分钟,避免白跑)</span>
  </div>
</div>
</main>
<div id="modalWrap"><div id="modal">
 <h3>➕ 存入人物库</h3>
 <div class="note" id="mSrc"></div>
 <div class="row" style="display:block">采用参考音(可试听换选):<div id="mRefs"></div></div>
 <div class="row">存入:
  <label><input type="radio" name="mtarget" value="exist" checked onchange="mtog(1)"> 已有人物</label>
  <select id="mExist"></select>
  <label><input type="radio" name="mtarget" value="new" onchange="mtog(2)"> 新建人物</label>
  <input type="text" id="mNew" placeholder="人物名" style="display:none;width:110px"></div>
 <div class="row">主要语言:
  <select id="mLang"><option value="zh">中文</option><option value="en">英语</option>
  <option value="ja">日语</option><option value="ko">韩语</option></select></div>
 <div class="row">备注:<input type="text" id="mNote" style="width:250px" placeholder="如:日本记者,常客(可选)"></div>
 <div style="display:flex;gap:10px;margin-top:14px">
  <button onclick="confirmLibSave()">保存</button>
  <button class="ghost" onclick="closeLibModal()">取消</button></div>
</div></div>
<script>
const PRESETS = [["zh-CN-YunjianNeural","云健·男沉稳"],["zh-CN-YunxiNeural","云希·男阳光"],
["zh-CN-YunyangNeural","云扬·男播音"],["zh-CN-YunxiaNeural","云夏·男少年"],
["zh-CN-XiaoxiaoNeural","晓晓·女温暖"],["zh-CN-XiaoyiNeural","晓伊·女活泼"],
["zh-CN-liaoning-XiaobeiNeural","小北·女东北"],["zh-TW-HsiaoChenNeural","曉臻·女台湾"],["zh-HK-HiuMaanNeural","曉曼·女粤语"]];

const DATA = [
 {ep:"北爱威尔士苏格兰想要脱英,跟中国台湾可不是一回事", short:"北爱威尔士脱英", date:"26-09-19", bvid:"BV1SGem6uEU9", parts:[
  {p:"P1", video:"/media/BV1SGem6uEU9_P1.mp4", verdict:"dub", note:"两位说话人均为英语 → 建议配音", spks:[
    {id:"SPK_00",lang:"en",talk:"20.3分钟",sample:"speaker_BV1SGem6uEU9_P1_SPK_00_sample.wav",who:"",host:false,merge:"",voice:"clone"},
    {id:"SPK_01",lang:"en",talk:"1.9分钟",sample:"speaker_BV1SGem6uEU9_P1_SPK_01_sample.wav",who:"",host:false,merge:"",voice:"clone"}]},
  {p:"P2", video:"/media/BV1SGem6uEU9_P2.mp4", verdict:"skip", note:"两位说话人均为中文 → 建议跳过(解说部分)", spks:[
    {id:"SPK_00",lang:"zh",talk:"1.3分钟",sample:"speaker_BV1SGem6uEU9_P2_SPK_00_sample.wav",who:"",host:false,merge:"",voice:"preset"},
    {id:"SPK_01",lang:"zh",talk:"17.1分钟",sample:"speaker_BV1SGem6uEU9_P2_SPK_01_sample.wav",who:"",host:false,merge:"",voice:"preset"}]}]},
 {ep:"剥壳嘉宾中国行:高市是个纯外行,我们也很难绷", short:"嘉宾中国行", date:"26-09-15", bvid:"BV1gpeJ6fEAk", parts:[
  {p:"P1", video:"/media/BV1gpeJ6fEAk_P1.mp4", verdict:"dub", note:"四人日语场(圆脸疑似未出镜)→ 建议配音;SPK_03 疑似分身", spks:[
    {id:"SPK_00",lang:"ja",talk:"8.9分钟",sample:"speaker_BV1gpeJ6fEAk_P1_SPK_00_sample.wav",who:"",host:false,merge:"",voice:"clone"},
    {id:"SPK_01",lang:"ja",talk:"10.5分钟",sample:"speaker_BV1gpeJ6fEAk_P1_SPK_01_sample.wav",who:"",host:false,merge:"",voice:"clone",warn:"机器曾误判中文,用户耳朵已纠正"},
    {id:"SPK_02",lang:"ja",talk:"11.1分钟",sample:"speaker_BV1gpeJ6fEAk_P1_SPK_02_sample.wav",who:"",host:false,merge:"",voice:"clone"},
    {id:"SPK_03",lang:"ja",talk:"5.4分钟",sample:"speaker_BV1gpeJ6fEAk_P1_SPK_03_sample.wav",who:"",host:false,merge:"SPK_00",voice:"preset",warn:"票数三分,疑似某人的分身"}]},
  {p:"P2", video:"/media/BV1gpeJ6fEAk_P2.mp4", verdict:"skip", note:"四位说话人均为中文 → 建议跳过", spks:[
    {id:"SPK_00",lang:"zh",talk:"9.3分钟",sample:"speaker_BV1gpeJ6fEAk_P2_SPK_00_sample.wav",who:"",host:false,merge:"",voice:"preset",warn:"有韩语噪声票,请终审"},
    {id:"SPK_01",lang:"zh",talk:"11.4分钟",sample:"speaker_BV1gpeJ6fEAk_P2_SPK_01_sample.wav",who:"",host:false,merge:"",voice:"preset"},
    {id:"SPK_02",lang:"zh",talk:"8.3分钟",sample:"speaker_BV1gpeJ6fEAk_P2_SPK_02_sample.wav",who:"",host:false,merge:"",voice:"preset"},
    {id:"SPK_03",lang:"zh",talk:"2.9分钟",sample:"speaker_BV1gpeJ6fEAk_P2_SPK_03_sample.wav",who:"",host:false,merge:"",voice:"preset"}]}]},
 {ep:"圆脸X小外:伊朗人在线锐评美以入侵?", short:"圆脸X小外", date:"26-01-16", bvid:"BV17UPszhE6o", parts:[
  {p:"全片", video:"/media/BV17UPszhE6o_full.mp4", verdict:"dub", note:"v2 已出片(SPK_00=圆脸克隆/SPK_01=云健),此处展示已核对状态", spks:[
    {id:"SPK_00",lang:"zh",talk:"13.1分钟",sample:"speaker_SPK_00_sample.wav",who:"圆脸",host:true,merge:"",voice:"clone"},
    {id:"SPK_01",lang:"en",talk:"25.2分钟",sample:"speaker_SPK_01_sample.wav",who:"小外",host:false,merge:"",voice:"preset"}]}]}
];

let curEp=0, curPart=0, userVerdicts={};
function langTag(l){const m={zh:["zh","中文"],en:["en","英语"],ja:["ja","日语"]}[l]||[l,l];return `<span class="tag ${m[0]}">${m[1]}</span>`}

function renderEps(){const box=document.getElementById("eps");box.innerHTML="";
 DATA.forEach((e,i)=>{const d=document.createElement("div");d.className="ep"+(i===curEp?" on":"");
  d.innerHTML=`<div class="epTitle">${e.ep}</div><small>${e.date} · ${e.bvid} · ${e.parts.map(p=>p.p).join("/")}</small>`;
  d.onclick=()=>{curEp=i;curPart=0;renderAll()};box.appendChild(d)});}

function renderPart(){const e=DATA[curEp],p=e.parts[curPart];
 const tabs=document.getElementById("ptabs");tabs.innerHTML="";
 e.parts.forEach((pt,i)=>{const t=document.createElement("div");t.className="ptab"+(i===curPart?" on":"");
  t.innerHTML=pt.p+(pt.verdict==="skip"?'<span class="skipflag">建议跳过</span>':"");
  t.onclick=()=>{curPart=i;renderPart();renderSpeakers()};tabs.appendChild(t)});
 document.getElementById("video").src=p.video;
 const key=`${e.bvid}/${p.p}`;const uv=userVerdicts[key]||p.verdict;
 const v=document.getElementById("verdict");v.className=uv==="skip"?"skip":"dub";
 v.innerHTML=`<b>${p.p}</b> ${p.note} → 当前判定:<b>${uv==="skip"?"跳过(不出片)":"配音"}</b>
  <button class="small ghost" onclick="flip('${key}')">${uv==="skip"?"改为配音":"改为跳过"}</button>`;}

function flip(key){const [bvid,p]=key.split("/");const e=DATA.find(x=>x.bvid===bvid);
 const part=e.parts.find(x=>x.p===p);const cur=userVerdicts[key]||part.verdict;
 userVerdicts[key]=cur==="skip"?"dub":"skip";renderPart();}

function renderSpeakers(){const p=DATA[curEp].parts[curPart];const box=document.getElementById("speakers");box.innerHTML="";
 p.spks.forEach((s,si)=>{const c=document.createElement("div");c.className="card"+(s.host?" host":"");
  const others=p.spks.filter(o=>o.id!==s.id).map(o=>`<option ${s.merge===o.id?"selected":""}>${o.id}</option>`).join("");
  const presets=PRESETS.map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
  c.innerHTML=`
   <div class="top">
    <div class="avatar" title="mock:头像后期由用户手动上传管理">👤</div>
    <div class="who"><b>${s.id}</b> ${langTag(s.lang)} <span class="note">${s.talk}</span>
     ${s.warn?`<span class="tag warn">${s.warn}</span>`:""}</div>
    <button class="small ${s.host?"hostBtnOn":"ghost"}" onclick="toggleHost(${si})">${s.host?"✓ 主持人":"设为主持人"}</button>
   </div>
   <audio controls preload="none" src="audio/${s.sample}"></audio>
   ${s.merge?"":`<div class="row"><button class="small ghost" onclick="openLibModal(${si})">➕ 存入人物库…</button>
    <span class="note">(此说话人参考音 → 人物,全局复用/声纹底料)</span></div>`}
   ${s.warn&&s.id==="SPK_03"?"":`<div class="row">备注名 <input type="text" value="${s.who}" placeholder="纯备注,方便你认人(不关联音色)" oninput="DATA[${curEp}].parts[${curPart}].spks[${si}].who=this.value">
     合并到 <select onchange="DATA[${curEp}].parts[${curPart}].spks[${si}].merge=this.value"><option value="">不合并</option>${others}</select></div>`}
   ${s.merge?`<div class="note" style="margin-top:6px">↩ 已标记合并到 ${s.merge}(提交后归人重算)</div>`
   :s.host?`<div class="vopt" style="display:block">
     主持人声音来自<b>人物库</b>(不用本期原声):
     <select onchange="DATA[${curEp}].parts[${curPart}].spks[${si}].person=this.value">
       ${PERSONS.map(x=>`<option ${(!s.person&&x.name==="圆脸")||s.person===x.name?"selected":""}>${x.name}</option>`).join("")}
       <option>＋ 新建人物…</option></select>
     <div class="cand"><audio controls preload="none" src="audio/ref_yuanlian_01.wav"></audio><span class="note">圆脸·参考音①(已验收)</span></div>
     <div class="cand"><audio controls preload="none" src="audio/ref_yuanlian_02.wav"></audio><span class="note">圆脸·参考音②(已验收)</span></div>
     <div class="note">克隆音色随人物库条目走;换主持人在下拉里换人物即可</div></div>`
   :`
   <div class="row">声音:
    <label><input type="radio" name="v${si}" ${s.voice==="clone"?"checked":""} onchange="setVoice(${si},'clone')"> 克隆(本人原声)</label>
    <label><input type="radio" name="v${si}" ${s.voice==="preset"?"checked":""} onchange="setVoice(${si},'preset')"> 预设音色</label>
    <label><input type="radio" name="v${si}" ${s.voice==="skip"?"checked":""} onchange="setVoice(${si},'skip')"> 跳过(不配)</label>
   </div>
   <div class="vopt" style="display:${s.voice==="clone"?"block":"none"}" id="cand${si}">
     克隆参考音候选(自动预选①,可换):${candHtml(DATA[curEp],p,s)}</div>
   <div class="vopt" style="display:${s.voice==="preset"?"block":"none"}" id="pre${si}">
     <select onchange="DATA[${curEp}].parts[${curPart}].spks[${si}].preset=this.value">${presets}</select>
     <div class="cand"><audio controls preload="none" src="audio/preset_zh_CN_YunjianNeural.mp3"></audio><span class="note">试听当前选择(mock 固定云健)</span></div></div>`}`;
  box.appendChild(c)});}

let CANDS={};
function candHtml(e,p,s){
 const stem = p.p==="全片" ? e.bvid+"_full" : e.bvid+"_"+p.p;
 const cl = CANDS[stem+"/"+s.id] || [[s.sample,"样本(该说话人混合样本)"],[s.sample,"样本(该说话人混合样本)"]];
 return cl.map((c,i)=>`<div class="cand">${i===0?"①":"②"}<input type="radio" name="cand_${stem}_${s.id}" ${i===0?"checked":""}>
  <audio controls preload="none" src="audio/${c[0]}"></audio><span class="note">${c[1]}</span></div>`).join("")
  +`<div class="note">候选=该说话人在片中不同时段的原声(不同句子/底噪),参考音的干净度决定克隆相似度</div>`;}

function toggleHost(si){const p=DATA[curEp].parts[curPart];const s=p.spks[si];
 if(!s.host){p.spks.forEach(o=>o.host=false);s.host=true;s.person="圆脸";}   // 只定人物库关联,不动备注名
 else s.host=false;renderSpeakers();renderPersons();}
function setVoice(si,v){const p=DATA[curEp].parts[curPart];p.spks[si].voice=v;
 const c=document.getElementById("cand"+si),pr=document.getElementById("pre"+si);
 if(c)c.style.display=v==="clone"?"block":"none";if(pr)pr.style.display=v==="preset"?"block":"none";}

const TINTS=[["#eef4fb","#4a7ec0"],["#f4f0fa","#8a6fc0"],["#eefaf1","#3f9a68"],
             ["#fdf3ea","#c08a4a"],["#faf0f3","#c05a7a"],["#f0f5f2","#5a8a80"]];
function renderPersons(){const box=document.getElementById("persons");box.innerHTML=
 PERSONS.map((p,i)=>{const [bg,edge]=TINTS[i%TINTS.length];return `<div class="person" style="background:${bg};border-left:4px solid ${edge};border-radius:8px;padding:8px 10px;margin:6px 0">
  <div class="avatar" style="background:${edge}33;border:2px solid ${edge}">👤</div>
  <div style="flex:1"><b style="color:${edge}">${p.name}</b> ${langTag(p.lang)} <span class="note">${p.note||""}</span>
   ${p.refs.map(r=>`<div class="cand"><audio controls preload="none" src="audio/${r[0]}"></audio><span class="note">${r[1]}</span></div>`).join("")}
  </div></div>`}).join("")+
 `<div class="person"><div class="avatar" style="font-size:22px">＋</div>
  <div style="flex:1"><b>新建人物</b><div class="note">mock:备注名+主要语言+上传头像+参考音文件</div></div></div>`;}

const PERSONS=[
 {name:"圆脸",lang:"zh",note:"主播·主持人 · 克隆 zero 模式已验收",refs:[
   ["ref_yuanlian_01.wav","参考音① · 收录自日常视频(斩杀线) 25s"],
   ["ref_yuanlian_02.wav","参考音② · 收录自日常视频(特朗普访华) 25s"]]},
 {name:"小外",lang:"en",note:"常客·伊朗记者 · 跨语言克隆已验证",refs:[
   ["guest_ref_english.wav","参考音① · 收录自 圆脸X小外 本期原声 24s"]]}];

let libCtx=null;
function openLibModal(si){const e=DATA[curEp],p=e.parts[curPart];const s=p.spks[si];
 libCtx={e,p,s};
 const stem=p.p==="全片"?e.bvid+"_full":e.bvid+"_"+p.p;
 const cl=CANDS[stem+"/"+s.id]||[[s.sample,"混合样本"]];
 document.getElementById("mSrc").textContent=`来源:${e.ep.split(" ")[0]} ${p.p} · ${s.id}(${langTag(s.lang)}) · ${s.talk}`;
 document.getElementById("mRefs").innerHTML=cl.map((c,i)=>`<div class="cand">
  <input type="radio" name="mref" value="${i}" ${i===0?"checked":""}>
  <audio controls preload="none" src="audio/${c[0]}"></audio><span class="note">${c[1]}</span></div>`).join("");
 document.getElementById("mExist").innerHTML=PERSONS.map(x=>`<option>${x.name}</option>`).join("");
 document.getElementById("mLang").value=s.lang||"zh";
 document.getElementById("mNote").value="";document.getElementById("mNew").value="";
 mtog(1);document.getElementById("modalWrap").classList.add("on");}
function mtog(k){document.getElementById("mExist").style.display=k===1?"":"none";
 document.getElementById("mNew").style.display=k===2?"":"none";}
function closeLibModal(){document.getElementById("modalWrap").classList.remove("on");libCtx=null;}
function confirmLibSave(){if(!libCtx)return;const {e,p,s}=libCtx;
 const mode=document.querySelector('input[name=mtarget]:checked').value;
 const lang=document.getElementById("mLang").value;
 const note=document.getElementById("mNote").value.trim();
 const stem=p.p==="全片"?e.bvid+"_full":e.bvid+"_"+p.p;
 const cl=CANDS[stem+"/"+s.id]||[[s.sample,"混合样本"]];
 const pick=cl[parseInt((document.querySelector('input[name=mref]:checked')||{value:"0"}).value,10)];
 let person;
 if(mode==="new"){const name=document.getElementById("mNew").value.trim();
  if(!name){alert("请填人物名");return;}
  person={name,lang,note,refs:[]};PERSONS.push(person);}
 else{person=PERSONS.find(x=>x.name===document.getElementById("mExist").value)||PERSONS[0];
  person.lang=lang;
  if(note&&!(person.note||"").includes(note))person.note=(person.note?person.note+" · ":"")+note;}
 person.refs.push([pick[0],`收录自 ${e.short} ${p.p} · ${s.id} · ${pick[1]}`]);
 renderPersons();closeLibModal();
 document.getElementById("status").textContent=`✅ 已存入人物「${person.name}」`;}

function renderAll(){renderEps();renderPart();renderSpeakers();renderPersons();}

document.getElementById("previewBtn").onclick=()=>{document.getElementById("status").textContent=
 "Mock:正式版会切片头60s+中段60s,用你选的音色合成小样挂到这里(约2-3分钟)";};
document.getElementById("submitBtn").onclick=async()=>{
 const e=DATA[curEp],p=e.parts[curPart];const key=`${e.bvid}/${p.p}`;
 const body={ep:e.bvid,part:p.p,verdict:userVerdicts[key]||p.verdict,
  speakers:p.spks.map(s=>({id:s.id,who:s.who,host:s.host,merge:s.merge,voice:s.voice,preset:s.preset||null}))};
 const st=document.getElementById("status");
 try{const r=await fetch("/save_review",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  st.textContent=r.ok?"✅ 已保存(核对台 mock 数据落 work/review_decisions_mock.json)":"❌ "+r.status;}catch(x){st.textContent="❌ 网络错误";}};
renderAll();
// 从片库"去核对"进入时按 bv 参数定位到对应期(?bv=BVxxxx)
(()=>{const bv=new URLSearchParams(location.search).get("bv");
 if(bv){const i=DATA.findIndex(e=>e.bvid===bv);
  if(i>=0&&i!==curEp){curEp=i;curPart=0;renderAll();}}
 const ep=document.querySelector("#eps .ep.on");if(ep)ep.scrollIntoView({block:"center"});})();
fetch('candidates.json').then(r=>r.json()).then(d=>{CANDS=d;renderSpeakers();}).catch(()=>{});
</script></body></html>
